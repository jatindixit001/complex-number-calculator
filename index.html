<!DOCTYPE html>
<html>
<head>
    <title>Complex Number Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <h1>Complex Number Calculator</h1>

    <h3>First Complex Number</h3>

    <input type="number" id="real1" placeholder="Real">
    <input type="number" id="imag1" placeholder="Imaginary">

    <h3>Second Complex Number</h3>

    <input type="number" id="real2" placeholder="Real">
    <input type="number" id="imag2" placeholder="Imaginary">

    <div class="buttons">
        <button onclick="add()">Addition</button>
        <button onclick="subtract()">Subtraction</button>
        <button onclick="multiply()">Multiplication</button>
        <button onclick="divide()">Division</button>
    </div>

    <h2>Result</h2>

    <p id="result">Result will appear here</p>

</div>

<script src="script.js"></script>

</body>
</html>
